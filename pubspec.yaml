name: openaccounting
description: "📊 Open-Source & Privacy-Friendly Desktop App for your Accounting, Invoices and Tax Reports. Designed for Freelancers."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^18.0.0
  dio: ^5.11.0
  shared_preferences: ^2.5.2
  pdf: ^3.13.0
  window_manager: ^0.5.2
  system_tray: ^0.1.1
  hotkey_manager: ^0.2.3
  auto_updater: ^1.0.0
  path: ^1.9.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  mockito: ^5.8.1
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true
  generate: true
